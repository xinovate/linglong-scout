# Linglong Scout — All-in-One Docker Compose
# Scout + Redis + RSSHub + SearXNG
#
# 使用：
#   docker compose up -d
#   docker compose logs -f

services:
  scout:
    build: .
    image: linglong-scout:latest
    container_name: linglong-scout
    restart: unless-stopped
    ports:
      - "127.0.0.1:9900:9900"
    environment:
      - TZ=Asia/Shanghai
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Docker-specific overrides (internal network service names)
      - LL_SCOUT_MCP_TRANSPORT=streamable-http
      - LL_SCOUT_MCP_HOST=0.0.0.0
      - LL_INGEST_SEARXNG_URL=http://searxng:8080
      - LL_INGEST_RSSHUB_URL=http://rsshub:1200
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
    env_file: .env
    volumes:
      - ./.scout.yml:/app/.scout.yml:ro
      - ./data:/root/linglong
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 9900)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - scout-net

  redis:
    image: redis:7-alpine
    container_name: linglong-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scout-net

  rsshub:
    image: docker.1ms.run/diygod/rsshub:latest
    container_name: linglong-rsshub
    restart: unless-stopped
    environment:
      - ACCESS_KEY=${RSSHUB_ACCESS_KEY}
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    networks:
      - scout-net

  searxng:
    image: searxng/searxng:latest
    container_name: linglong-searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - TZ=Asia/Shanghai
      - SEARXNG_BASE_URL=http://searxng:8080/
    networks:
      - scout-net

networks:
  scout-net:
    driver: bridge
