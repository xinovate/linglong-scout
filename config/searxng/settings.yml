# SearXNG settings — minimal config for Linglong Scout
# See https://docs.searxng.org/admin/settings/ for full options

use_default_settings: true

server:
  secret_key: "linglong-scout-dev-key"
  limiter: false

search:
  formats:
    - html
    - json
  default_lang: "en"

outgoing:
  request_timeout: 10.0

engines:
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
