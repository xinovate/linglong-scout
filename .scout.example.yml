# Linglong Scout 配置模板
# 复制为 .scout.yml 并填入实际值
# 敏感值通过 ${ENV_VAR} 从环境变量注入，不硬编码
# Pydantic-settings env prefixes: LL_SCOUT_* (root), LL_SCOUT_LLM_* (llm), LL_INGEST_* (ingest)

debug: false
log_level: "INFO"
# log_file: ~/linglong/logs/scout.log      # 日志文件路径，null 禁用文件日志

# ── LLM ──────────────────────────────────────
llm:
  llm_api_key: ""                         # Or set LL_SCOUT_LLM_API_KEY
  llm_base_url: "https://api.example.com/v1"
  llm_model: ""                            # Required: set via LL_SCOUT_LLM_MODEL or .scout.yml
  llm_protocol: auto                       # auto | anthropic | openai；方舟 Coding Plan 使用 anthropic
  llm_temperature: 0.3                    # LLM 采样温度
  llm_disable_thinking: false             # 思考模型(glm-5.1 等)禁用思考,让 max_tokens 全给 content(否则 reasoning 占预算致输出截断/空)

# ── 信息采集 ──────────────────────────────────
ingest:
  # RSSHub 实例（可选，仅 route 类型源使用）
  rsshub_url: ${LL_INGEST_RSSHUB_URL:-http://localhost:1200}
  rsshub_access_key: ${RSSHUB_ACCESS_KEY}

  # LLM 早报生成
  llm_max_tokens: 12000
  llm_retries: 2
  llm_timeout: 300

  # GitHub 开源趋势
  # GitHub API token (optional, for higher rate limits).
  # Set via environment variable: export GITHUB_TOKEN=ghp_xxxx
  github_trending_limits:
    daily: 10
    weekly: 3
    monthly: 3
  github_search_fallback:
    since_days: 30
    min_stars: 500

  # 早报去重（按维度回看天数）
  dedup_windows:
    关键人物: 14
    行业要闻: 7
    融资动态: 7
    政策动态: 14
    学术前沿: 14

  # 早报时段标记
  brief_schedule_time: "07:00"

  # 自动采集（MCP server 启动后按此时间每天采集原始数据，留空禁用）
  collect_schedule: "06:55"

  # 原始数据存储
  raw_data_dir: ~/linglong/data/raw        # JSON 冷存储目录
  raw_redis_ttl_days: 14                   # Redis 热 TTL（天）

  # RSS 订阅源
  # url 字段：直连 RSS，不做任何处理
  # route 字段：拼接 rsshub_url + 注入 access_key（需配置 rsshub_url）
  rss_sources:
    # ── 公开 RSS 源（直连，无需认证）──
    - name: AIHOT
      url: https://aihot.virxact.com/feed
    - name: 36氪
      url: https://36kr.com/feed
    - name: 量子位
      url: https://www.qbitai.com/feed
    - name: The Rundown AI
      url: https://rss.beehiiv.com/feeds/2R3C6Bt5wj.xml
    - name: TechCrunch AI
      url: https://techcrunch.com/category/artificial-intelligence/feed/
    - name: The Verge AI
      url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    - name: VentureBeat AI
      url: https://venturebeat.com/category/ai/feed/
    - name: SyncedReview
      url: https://syncedreview.com/feed/
    - name: EU AI Act
      url: https://artificialintelligenceact.eu/feed/
    # ── 学术前沿 ──
    - name: arXiv cs.AI
      url: https://arxiv.org/rss/cs.AI
    - name: arXiv cs.CL
      url: https://arxiv.org/rss/cs.CL
    - name: arXiv cs.LG
      url: https://arxiv.org/rss/cs.LG
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
    # ── RSSHub 源（需要 rsshub_url + rsshub_access_key 配置）──
    # - name: 36氪快讯
    #   route: /36kr/newsflashes
    # - name: 华尔街见闻快讯
    #   route: /wallstreetcn/live
    # - name: 财新网
    #   route: /caixin/latest
    # - name: 工信部文件公示
    #   route: /gov/miit/wjgs
    # - name: 发改委新闻动态
    #   route: /gov/ndrc/xwdt

  # 采集包定义
  packages:
    - name: ai-morning-brief
      topic: AI 早报

# ── MCP Server ────────────────────────────────
mcp:
  transport: ${LL_SCOUT_MCP_TRANSPORT:-stdio}  # stdio（本地）| streamable-http（远程部署）
  host: ${LL_SCOUT_MCP_HOST:-127.0.0.1}        # Docker 部署设为 0.0.0.0，stdio 模式忽略此值
  port: 9900
  auth_token: ${LL_MCP_AUTH_TOKEN}         # Bearer token（留空或未设置 = 无认证）
  redis_url: ${REDIS_URL}                  # 远程部署用 Redis 验证 token
  # allowed_hosts:                          # 远程部署需要（DNS rebinding 防护）
  #   - "open.linglong.wiki"
  #   - "127.0.0.1"
  #   - "127.0.0.1:9900"
