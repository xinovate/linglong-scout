# Linglong Scout 配置模板
# 复制为 .scout.yml 并填入实际值
# 敏感值通过 ${ENV_VAR} 从环境变量注入，不硬编码
# Pydantic-settings env prefixes: LL_SCOUT_* (root), LL_SCOUT_LLM_* (llm), LL_INGEST_* (ingest)

debug: false
log_level: "INFO"
# log_file: ~/linglong/logs/scout.log      # 日志文件路径，null 禁用文件日志

# ── LLM ──────────────────────────────────────
llm:
  llm_api_key: ""                         # Or set LL_SCOUT_LLM_API_KEY
  llm_base_url: "https://api.example.com/v1"
  llm_model: ""                            # Required: set via LL_SCOUT_LLM_MODEL or .scout.yml
  llm_temperature: 0.3                    # LLM 采样温度

# ── 信息采集 ──────────────────────────────────
ingest:
  # SearXNG 搜索服务
  searxng_url: ${LL_INGEST_SEARXNG_URL:-http://localhost:8088}
  searxng_api_key: ${SEARXNG_API_KEY}
  search_timeout: 30

  # RSSHub 实例（可选，仅 route 类型源使用）
  rsshub_url: ${LL_INGEST_RSSHUB_URL:-http://localhost:1200}
  rsshub_access_key: ${RSSHUB_ACCESS_KEY}

  # LLM 早报生成
  llm_max_tokens: 8000
  llm_retries: 2
  llm_timeout: 120

  # GitHub 开源趋势
  # GitHub API token (optional, for higher rate limits).
  # Set via environment variable: export GITHUB_TOKEN=ghp_xxxx
  github_trending_limits:
    daily: 10
    weekly: 3
    monthly: 3
  github_search_fallback:
    since_days: 30
    min_stars: 500

  # 早报去重（按维度回看天数）
  dedup_windows:
    关键人物: 14
    行业要闻: 7
    融资动态: 7
    政策动态: 14
    学术前沿: 14

  # 早报时段标记
  brief_schedule_time: "07:00"

  # 自动采集（MCP server 启动后按此时间每天采集原始数据，留空禁用）
  collect_schedule: "06:55"

  # 原始数据存储
  raw_data_dir: ~/linglong/data/raw        # JSON 冷存储目录
  raw_redis_ttl_days: 14                   # Redis 热 TTL（天）

  # RSS 订阅源
  # url 字段：直连 RSS，不做任何处理
  # route 字段：拼接 rsshub_url + 注入 access_key（需配置 rsshub_url）
  rss_sources:
    # ── 公开 RSS 源（直连，无需认证）──
    - name: AIHOT
      url: https://aihot.virxact.com/feed
    - name: 36氪
      url: https://36kr.com/feed
    - name: 量子位
      url: https://www.qbitai.com/feed
    - name: The Rundown AI
      url: https://rss.beehiiv.com/feeds/2R3C6Bt5wj.xml
    - name: TechCrunch AI
      url: https://techcrunch.com/category/artificial-intelligence/feed/
    - name: The Verge AI
      url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    - name: VentureBeat AI
      url: https://venturebeat.com/category/ai/feed/
    - name: SyncedReview
      url: https://syncedreview.com/feed/
    - name: EU AI Act
      url: https://artificialintelligenceact.eu/feed/
    # ── 学术前沿 ──
    - name: arXiv cs.AI
      url: https://arxiv.org/rss/cs.AI
    - name: arXiv cs.CL
      url: https://arxiv.org/rss/cs.CL
    - name: arXiv cs.LG
      url: https://arxiv.org/rss/cs.LG
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
    # ── RSSHub 源（需要 rsshub_url + rsshub_access_key 配置）──
    # - name: 36氪快讯
    #   route: /36kr/newsflashes
    # - name: 华尔街见闻快讯
    #   route: /wallstreetcn/live
    # - name: 财新网
    #   route: /caixin/latest
    # - name: 工信部文件公示
    #   route: /gov/miit/wjgs
    # - name: 发改委新闻动态
    #   route: /gov/ndrc/xwdt

  # 采集包定义
  # 策略：RSS 为主力（人工编辑筛选，高信噪比），SearXNG 为实体级精准补充
  packages:
    - name: ai-morning-brief
      topic: AI 早报
      search_queries:
        # ── 关键人物（只留实体名查询，RSS 不覆盖的具体人物动态） ──
        - keywords:
            - "Karpathy AI latest 2026"
            - "LeCun JEPA world model latest"
            - "Ilya Sutskever SSI news 2026"
            - "Sam Altman OpenAI latest 2026"
            - "Dario Amodei Anthropic latest 2026"
            - "Demis Hassabis DeepMind latest 2026"
            - "梁文锋 DeepSeek 动态"
            - "李飞飞 AI 最新动态 2026"
          max_results: 2
        # ── 公司/产品（只留具体公司名+产品名，RSS 不覆盖的独家动态） ──
        - keywords:
            - "Anthropic Claude latest 2026"
            - "Google Gemini release 2026"
            - "DeepSeek R2 最新动态 2026"
            - "月之暗面 Kimi K2 最新动态 2026"
            - "MiniMax 海螺AI 最新动态 2026"
            - "字节跳动 豆包 Seedance 最新动态"
          max_results: 2
        # ── 应用/技术（只留具体技术名，RSS 不覆盖的新产品/新框架） ──
        - keywords:
            - "MCP Model Context Protocol latest 2026"
            - "AI video generation Kling Sora 2026"
            - "Unitree robot latest news 2026"
          max_results: 2
        # ── 政策补充（国际政策 RSS 覆盖有限，用 SearXNG 精准补充） ──
        - keywords:
            - "EU AI Act enforcement 2026"
            - "AI copyright lawsuit 2026"
            - "AI chip export control 2026"
          max_results: 2
        # ── 超级个体/一人公司（AI 赋能个体创业趋势） ──
        - keywords:
            - "solo founder AI company launch 2026"
            - "one person company OPC AI 2026"
            - "indie hacker AI product launch 2026"
            - "一人公司 OPC AI 2026"
            - "超级个体 AI 创业 2026"
          max_results: 2

# ── MCP Server ────────────────────────────────
mcp:
  transport: ${LL_SCOUT_MCP_TRANSPORT:-stdio}  # stdio（本地）| streamable-http（远程部署）
  host: ${LL_SCOUT_MCP_HOST:-127.0.0.1}        # Docker 部署设为 0.0.0.0，stdio 模式忽略此值
  port: 9900
  auth_token: ${LL_MCP_AUTH_TOKEN}         # Bearer token（留空或未设置 = 无认证）
  redis_url: ${REDIS_URL}                  # 远程部署用 Redis 验证 token
  # allowed_hosts:                          # 远程部署需要（DNS rebinding 防护）
  #   - "open.linglong.wiki"
  #   - "127.0.0.1"
  #   - "127.0.0.1:9900"
