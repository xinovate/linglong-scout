name: Deploy to Server

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'xinovate/linglong-scout'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/linglong-scout
            git checkout -- .
            git pull origin main
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f
            sleep 5
            docker compose ps
            python3 -c "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',9900)); s.close()" || (echo "Health check failed" && docker compose logs --tail=20 && exit 1)
